<StackLayout [formGroup]="signUpForm" padding="20">

    <Label text="Sign Up Form" fontSize="24"></Label>

    <TextField
        formControlName="email"
        hint="Enter your email"
        keyboardType="email">
    </TextField>

    <TextField
        formControlName="username"
        hint="Enter your username">
    </TextField>

    <Button
        text="Sign Up"
        (tap)="onButtonTap()">
    </Button>

</StackLayout>
