
<StackLayout [formGroup]="signUpForm" class="p-20">

  <TextField
    formControlName="email"
    hint="Email"
    keyboardType="email">
  </TextField>

  <TextField
    formControlName="username"
    hint="Username">
  </TextField>

  <Button
    text="Sign Up"
    (tap)="onButtonTap()">
  </Button>

</StackLayout>
