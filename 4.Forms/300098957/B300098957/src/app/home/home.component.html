<ActionBar class="action-bar">
  <Label text="Météo"></Label>
</ActionBar>

<StackLayout
  [formGroup]="signUpForm"
  class="form-container">

  <Label
    text="Créer un compte"
    class="title">
  </Label>

  <Label
    text="Inscrivez-vous pour accéder à la météo"
    class="subtitle">
  </Label>

  <TextField
    formControlName="email"
    hint="Courriel"
    keyboardType="email"
    class="input">
  </TextField>

  <TextField
    formControlName="username"
    hint="Nom d'utilisateur"
    class="input">
  </TextField>

  <Button
    text="S'inscrire"
    (tap)="onButtonTap()"
    class="signup-button">
  </Button>

</StackLayout>
