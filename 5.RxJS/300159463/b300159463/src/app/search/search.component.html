
<StackLayout class="form">

    <Label
        text="Search Country by Capital"
        class="h2 text-center">
    </Label>

    <TextField
        class="input"
        hint="Enter a capital"
        [(ngModel)]="name">
    </TextField>

    <Button
        text="Search"
        class="btn btn-primary"
        (tap)="searchCapital()">
    </Button>

    <Label
        [text]="errorMessage"
        color="red"
        textWrap="true">
    </Label>

    <ListView
        [items]="countries"
        height="650">

        <ng-template let-item="item">

            <StackLayout class="p-10">

                <Label
                    [text]="item.name"
                    class="h2">
                </Label>

                <Label
                    [text]="item.capital">
                </Label>

            </StackLayout>

        </ng-template>

    </ListView>

</StackLayout>
