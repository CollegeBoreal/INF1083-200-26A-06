
<StackLayout class="form" padding="20">

    <Label
        text="Search Country by Capital"
        fontSize="24"
        color="#173B73"
        textAlignment="center">
    </Label>

    <TextField
        class="input"
        hint="Enter a capital (e.g. Ottawa)"
        [(ngModel)]="name">
    </TextField>

    <Button
        text="Search"
        class="btn btn-primary"
        (tap)="searchCapital()">
    </Button>

    <ListView
        [items]="countries"
        height="450">

        <ng-template let-item="item">
            <StackLayout padding="15">

                <Label
                    [text]="item.name"
                    fontSize="20">
                </Label>

                <Label
                    [text]="item.capital"
                    fontSize="16">
                </Label>

            </StackLayout>
        </ng-template>

    </ListView>

</StackLayout>
