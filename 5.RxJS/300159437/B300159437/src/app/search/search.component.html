
<StackLayout backgroundColor="#EDF4FF" padding="20">

    <Label
        text="WORLD EXPLORER"
        fontSize="28"
        fontWeight="bold"
        color="#173B73"
        textAlignment="center">
    </Label>

    <Label
        text="Find the capital of any country"
        fontSize="16"
        color="#475569"
        textAlignment="center"
        marginTop="15">
    </Label>

    <TextField
        hint="Enter a country (e.g. Canada)"
        [(ngModel)]="name"
        backgroundColor="white"
        color="black"
        padding="15"
        marginTop="30">
    </TextField>

    <Button
        text="FIND CAPITAL"
        (tap)="searchCapital()"
        backgroundColor="#2563EB"
        color="white"
        marginTop="15">
    </Button>

    <ActivityIndicator
        [busy]="loading"
        color="#2563EB">
    </ActivityIndicator>

    <Label
        [text]="message"
        color="red"
        textWrap="true"
        marginTop="15">
    </Label>

    <StackLayout
        *ngFor="let country of countries"
        backgroundColor="white"
        padding="20"
        marginTop="15"
        borderRadius="12">

        <Label
            [text]="country.name"
            fontSize="22"
            fontWeight="bold"
            color="#173B73">
        </Label>

        <Label
            [text]="country.capital"
            fontSize="20"
            color="#2563EB"
            marginTop="10">
        </Label>

    </StackLayout>

</StackLayout>
