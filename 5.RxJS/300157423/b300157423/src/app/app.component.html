<ActionBar title="Drapeaux du monde"></ActionBar>

<GridLayout rows="auto, auto, auto, auto, *" padding="10">
  <TextField
    row="0"
    hint="Pays : Algerie, Canada, etat uni..."
    [(ngModel)]="name">
  </TextField>

  <Button
    row="1"
    text="Rechercher"
    [isEnabled]="!loading"
    (tap)="searchCountries()">
  </Button>

  <Button
    row="2"
    text="Recharger les drapeaux"
    [isEnabled]="!loading"
    (tap)="loadCountries()">
  </Button>

  <Label
    row="3"
    [text]="message"
    textWrap="true">
  </Label>

  <ListView row="4" [items]="countries">
    <ng-template let-item="item">
      <StackLayout padding="15">
        <Label
          [text]="item.name"
          fontSize="22"
          fontWeight="bold"
          textAlignment="center"
          textWrap="true">
        </Label>

        <Image
          [src]="item.flag"
          height="160"
          stretch="aspectFit"
          marginTop="10">
        </Image>
      </StackLayout>
    </ng-template>
  </ListView>
</GridLayout>
