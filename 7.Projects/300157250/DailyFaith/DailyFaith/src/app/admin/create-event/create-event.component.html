<ActionBar title="Créer un événement"></ActionBar>

<ScrollView>

  <StackLayout class="container">

    <!-- En-tête -->

    <StackLayout class="header-card">

      <Label
        text="&#xf271;"
        class="header-icon">
      </Label>

      <Label
        text="Nouvel événement"
        class="header-title"
        textWrap="true">
      </Label>

      <Label
        text="Rassemblez votre communauté dans la foi."
        class="header-description"
        textWrap="true">
      </Label>

    </StackLayout>

    <!-- Sélection de l'église -->

    <StackLayout class="church-section">

      <Label
        text="SÉLECTIONNER UNE ÉGLISE"
        class="section-title">
      </Label>

      <Label
        text="Choisissez la communauté concernée par cet événement."
        class="section-description"
        textWrap="true">
      </Label>

      @for (church of churches; track church.id) {

        <GridLayout
          columns="60, *, 30"
          [class]="selectedChurchId === church.id ? 'church-selected' : 'church-card'"
          (tap)="selectChurch(church)">

          <GridLayout col="0" class="church-logo">

            @if (church.logo) {

              <Image
                [src]="getLogoPath(church)"
                class="church-image"
                stretch="aspectFill">
              </Image>

            } @else {

              <Label
                text="&#xf51d;"
                class="church-icon"
                horizontalAlignment="center"
                verticalAlignment="center">
              </Label>

            }

          </GridLayout>

          <StackLayout
            col="1"
            verticalAlignment="center">

            <Label
              [text]="church.name"
              [class]="selectedChurchId === church.id ? 'selected-name' : 'church-name'"
              textWrap="true">
            </Label>

            <Label
              [text]="'@' + church.username"
              class="church-username">
            </Label>

          </StackLayout>

          @if (selectedChurchId === church.id) {

            <Label
              col="2"
              text="&#xf058;"
              class="check-icon"
              verticalAlignment="center">
            </Label>

          }

        </GridLayout>

      } @empty {

        <Label
          text="Vous devez créer une église avant de publier un événement."
          class="empty-message"
          textWrap="true">
        </Label>

        <Button
          text="+ Créer mon église"
          class="publish-button"
          (tap)="createChurch()">
        </Button>

      }

    </StackLayout>

    <!-- Formulaire -->

    @if (churches.length > 0) {

      <StackLayout class="form-card">

        <Label
          text="INFORMATIONS DE L'ÉVÉNEMENT"
          class="section-title">
        </Label>

        <Label
          text="Nom de l'événement"
          class="field-label">
        </Label>

        <TextField
          hint="Ex : Culte du dimanche"
          [text]="title"
          (textChange)="onTitleChange($event)"
          class="input">
        </TextField>

        <Label
          text="Date"
          class="field-label">
        </Label>

        <TextField
          hint="Ex : 6 décembre 2026"
          [text]="date"
          (textChange)="onDateChange($event)"
          class="input">
        </TextField>

        <Label
          text="Heure"
          class="field-label">
        </Label>

        <TextField
          hint="Ex : 10 h 00"
          [text]="time"
          (textChange)="onTimeChange($event)"
          class="input">
        </TextField>

        <Label
          text="Lieu"
          class="field-label">
        </Label>

        <TextField
          hint="Ex : Église principale"
          [text]="location"
          (textChange)="onLocationChange($event)"
          class="input">
        </TextField>

        <Label
          text="Description"
          class="field-label">
        </Label>

        <TextView
          hint="Décrivez votre événement..."
          [text]="description"
          (textChange)="onDescriptionChange($event)"
          class="description-input">
        </TextView>

        <Button
          text="Publier l'événement"
          (tap)="publishEvent()"
          class="publish-button">
        </Button>

      </StackLayout>

    }

    <Button
      text="Retour au tableau de bord"
      (tap)="cancel()"
      class="cancel-button">
    </Button>

  </StackLayout>

</ScrollView>
