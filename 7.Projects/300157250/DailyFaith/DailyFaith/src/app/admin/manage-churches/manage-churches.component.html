<ActionBar title="Mes églises"></ActionBar>

<ScrollView>

  <StackLayout class="container">

    <Label
      text="MES COMMUNAUTÉS"
      class="page-title">
    </Label>

    <Label
      text="Retrouvez et gérez vos pages d'églises."
      class="subtitle"
      textWrap="true">
    </Label>

    <!-- Chargement Firebase -->

    @if (loading) {

      <ActivityIndicator
        [busy]="loading"
        color="#183B32">
      </ActivityIndicator>

      <Label
        text="Chargement des églises..."
        class="subtitle"
        textAlignment="center">
      </Label>

    }

    @if (errorMessage) {

      <Label
        [text]="errorMessage"
        color="#B91C1C"
        textWrap="true">
      </Label>

    }

    <!-- Statistiques -->

    <GridLayout columns="*, *" class="statistics">

      <StackLayout col="0" class="stat-card">

        <Label text="&#xf51d;" class="stat-icon">
        </Label>

        <Label
          [text]="totalChurches"
          class="stat-number">
        </Label>

        <Label text="Églises" class="stat-label">
        </Label>

      </StackLayout>

      <StackLayout col="1" class="stat-card">

        <Label text="&#xf0c0;" class="stat-icon">
        </Label>

        <Label
          [text]="totalFollowers"
          class="stat-number">
        </Label>

        <Label
          text="Abonnés locaux"
          class="stat-label">
        </Label>

      </StackLayout>

    </GridLayout>

    <Button
      text="Actualiser les églises"
      class="edit-button"
      [isEnabled]="!loading"
      (tap)="loadChurches()">
    </Button>

    <Label text="Vos pages" class="section-title">
    </Label>

    <!-- Liste des églises -->

    @for (church of churches; track church.id) {

      <StackLayout class="church-card">

        <!-- Couverture -->

        <GridLayout class="cover" height="180">

          @if (church.cover) {

            <Image
              [src]="getCoverPath(church)"
              stretch="aspectFill"
              width="100%"
              height="180">
            </Image>

          } @else {

            <Label
              text="&#xf51d;"
              class="cover-icon"
              horizontalAlignment="center"
              verticalAlignment="center">
            </Label>

          }

        </GridLayout>

        <!-- Logo -->

        <GridLayout
          class="logo-container"
          horizontalAlignment="center">

          @if (church.logo) {

            <Image
              [src]="getLogoPath(church)"
              class="logo-image"
              stretch="aspectFill">
            </Image>

          } @else {

            <Label
              text="&#xf51d;"
              class="logo-icon"
              horizontalAlignment="center"
              verticalAlignment="center">
            </Label>

          }

        </GridLayout>

        <StackLayout class="church-content">

          <Label
            [text]="church.name"
            class="church-name"
            textWrap="true">
          </Label>

          <Label
            [text]="'@' + church.username"
            class="username">
          </Label>

          <!-- Statut de synchronisation -->

          @if (church.online) {

            <Label
              text="● EN LIGNE · FIREBASE"
              color="#15803D"
              fontSize="12"
              fontWeight="bold"
              textAlignment="center"
              marginTop="8"
              marginBottom="8">
            </Label>

          } @else {

            <Label
              text="● STOCKAGE LOCAL · V2"
              color="#A88A50"
              fontSize="12"
              fontWeight="bold"
              textAlignment="center"
              marginTop="8"
              marginBottom="8">
            </Label>

          }

          <!-- Statistiques -->

          <GridLayout
            columns="*, *"
            class="church-stats">

            <StackLayout col="0">

              <Label
                [text]="church.online ? '—' : church.followers.length"
                class="follower-number">
              </Label>

              <Label
                text="Abonnés"
                class="stat-label">
              </Label>

            </StackLayout>

            <StackLayout col="1">

              <Label
                text="&#xf058;"
                class="status-icon">
              </Label>

              <Label
                text="Page créée"
                class="stat-label">
              </Label>

            </StackLayout>

          </GridLayout>

          <StackLayout class="separator">
          </StackLayout>

          <!-- Pasteur -->

          <GridLayout
            columns="25, *"
            class="info-row">

            <Label
              col="0"
              text="&#xf007;"
              class="small-icon">
            </Label>

            <Label
              col="1"
              [text]="church.pastor"
              class="pastor-name"
              textWrap="true">
            </Label>

          </GridLayout>

          <!-- Localisation -->

          <GridLayout
            columns="25, *"
            class="info-row">

            <Label
              col="0"
              text="&#xf3c5;"
              class="small-icon">
            </Label>

            <Label
              col="1"
              [text]="church.city + ', ' + church.country"
              class="location"
              textWrap="true">
            </Label>

          </GridLayout>

          @if (church.address) {

            <Label
              [text]="church.address"
              class="address"
              textWrap="true">
            </Label>

          }

          <Label
            [text]="church.description || 'Aucune description.'"
            class="description"
            textWrap="true">
          </Label>

          <Button
            text="Voir le profil public"
            class="create-button"
            (tap)="viewChurchProfile(church)">
          </Button>

          <Button
            text="Modifier le profil"
            class="edit-button"
            (tap)="editChurch(church)">
          </Button>

        </StackLayout>

      </StackLayout>

    } @empty {

      @if (!loading) {

        <StackLayout class="empty-card">

          <Label
            text="&#xf51d;"
            class="empty-icon">
          </Label>

          <Label
            text="Aucune église affichée"
            class="empty-title">
          </Label>

          <Label
            text="Créez votre première page pour développer votre communauté."
            class="subtitle"
            textWrap="true">
          </Label>

        </StackLayout>

      }

    }

    <Button
      text="+ Créer une église"
      class="create-button"
      (tap)="createChurch()">
    </Button>

    <Button
      text="Retour au tableau de bord"
      class="back-button"
      (tap)="goBack()">
    </Button>

  </StackLayout>

</ScrollView>
