<ActionBar title="Modifier le profil"></ActionBar>

<ScrollView>

  <StackLayout class="container">

    @if (loading) {

      <ActivityIndicator
        [busy]="loading"
        color="#183B32">
      </ActivityIndicator>

      <Label
        text="Chargement du profil..."
        class="subtitle">
      </Label>

    } @else if (authorized) {

      <!-- Couverture -->

      <GridLayout class="cover" height="190">

        @if (cover) {

          <Image
            [src]="coverPath"
            stretch="aspectFill"
            width="100%"
            height="190">
          </Image>

        } @else {

          <Label
            text="&#xf51d;"
            class="church-icon"
            horizontalAlignment="center"
            verticalAlignment="center">
          </Label>

        }

      </GridLayout>

      <!-- Logo -->

      <GridLayout
        class="logo-container"
        horizontalAlignment="center">

        @if (logo) {

          <Image
            [src]="logoPath"
            class="logo-image"
            stretch="aspectFill">
          </Image>

        } @else {

          <Label
            text="&#xf51d;"
            class="logo-icon"
            horizontalAlignment="center"
            verticalAlignment="center">
          </Label>

        }

      </GridLayout>

      <Label
        [text]="name"
        class="page-title"
        textWrap="true">
      </Label>

      <Label
        [text]="'@' + username"
        class="username">
      </Label>

      <Label
        [text]="online ? '● EN LIGNE · FIREBASE' : '● STOCKAGE LOCAL · V2'"
        [color]="online ? '#15803D' : '#A88A50'"
        fontSize="12"
        fontWeight="bold"
        textAlignment="center"
        marginBottom="15">
      </Label>

      <!-- Personnalisation -->

      <StackLayout class="form-card">

        <Label
          text="PERSONNALISATION"
          class="section-title">
        </Label>

        @if (online) {

          <Label
            text="La modification des images en ligne sera disponible prochainement."
            class="subtitle"
            textWrap="true">
          </Label>

        } @else {

          <Button
            text="Modifier le logo"
            class="photo-button"
            [isEnabled]="!selectingImage && !saving"
            (tap)="selectLogo()">
          </Button>

          @if (logo) {

            <Button
              text="Retirer le logo"
              class="remove-button"
              [isEnabled]="!selectingImage && !saving"
              (tap)="removeLogo()">
            </Button>

          }

          <Button
            text="Modifier la couverture"
            class="photo-button"
            [isEnabled]="!selectingImage && !saving"
            (tap)="selectCover()">
          </Button>

          @if (cover) {

            <Button
              text="Retirer la couverture"
              class="remove-button"
              [isEnabled]="!selectingImage && !saving"
              (tap)="removeCover()">
            </Button>

          }

          <ActivityIndicator
            [busy]="selectingImage"
            [visibility]="selectingImage ? 'visible' : 'collapse'">
          </ActivityIndicator>

        }

      </StackLayout>

      <!-- Informations générales -->

      <StackLayout class="form-card">

        <Label
          text="INFORMATIONS GÉNÉRALES"
          class="section-title">
        </Label>

        <Label
          text="Nom de l'église *"
          class="field-label">
        </Label>

        <TextField
          [text]="name"
          [editable]="!saving"
          class="input"
          (textChange)="onNameChange($event)">
        </TextField>

        <Label
          text="Identifiant de la page *"
          class="field-label">
        </Label>

        <TextField
          [text]="username"
          [editable]="!saving"
          autocapitalizationType="none"
          autocorrect="false"
          class="input"
          (textChange)="onUsernameChange($event)">
        </TextField>

        <Label
          text="Nom du pasteur *"
          class="field-label">
        </Label>

        <TextField
          [text]="pastor"
          [editable]="!saving"
          class="input"
          (textChange)="onPastorChange($event)">
        </TextField>

        <!-- Localisation -->

        <Label
          text="LOCALISATION"
          class="section-title">
        </Label>

        <Label text="Pays *" class="field-label">
        </Label>

        <TextField
          [text]="country"
          [editable]="!saving"
          class="input"
          (textChange)="onCountryChange($event)">
        </TextField>

        <Label text="Ville *" class="field-label">
        </Label>

        <TextField
          [text]="city"
          [editable]="!saving"
          class="input"
          (textChange)="onCityChange($event)">
        </TextField>

        <Label text="Adresse" class="field-label">
        </Label>

        <TextField
          [text]="address"
          [editable]="!saving"
          class="input"
          (textChange)="onAddressChange($event)">
        </TextField>

        <!-- Présentation -->

        <Label
          text="PRÉSENTATION"
          class="section-title">
        </Label>

        <Label
          text="Description"
          class="field-label">
        </Label>

        <TextView
          [text]="description"
          [editable]="!saving"
          class="description-input"
          (textChange)="onDescriptionChange($event)">
        </TextView>

        <Label
          text="* Champs obligatoires"
          class="help-text">
        </Label>

        @if (saving) {

          <ActivityIndicator
            [busy]="saving"
            color="#183B32">
          </ActivityIndicator>

        }

        <Button
          [text]="saving ? 'Enregistrement...' : 'Enregistrer les modifications'"
          class="save-button"
          [isEnabled]="!selectingImage && !saving"
          (tap)="saveChanges()">
        </Button>

        <Button
          text="Annuler"
          class="cancel-button"
          [isEnabled]="!selectingImage && !saving"
          (tap)="goBack()">
        </Button>

      </StackLayout>

    } @else {

      <StackLayout class="form-card">

        <Label
          text="Profil indisponible"
          class="page-title">
        </Label>

        <Label
          [text]="errorMessage || 'Cette église est introuvable ou ne vous appartient pas.'"
          class="subtitle"
          textWrap="true">
        </Label>

        <Button
          text="Retour à mes églises"
          class="save-button"
          (tap)="goBack()">
        </Button>

      </StackLayout>

    }

  </StackLayout>

</ScrollView>
