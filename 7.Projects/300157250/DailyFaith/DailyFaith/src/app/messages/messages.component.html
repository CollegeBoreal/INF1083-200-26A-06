<ActionBar title="Messages bibliques"></ActionBar>

<GridLayout rows="*, auto">

  <ScrollView row="0">

    <StackLayout class="container">

      <Label
        text="Messages bibliques"
        class="title"
        textWrap="true">
      </Label>

      <Label
        text="Les publications de vos communautés."
        class="subtitle"
        textWrap="true">
      </Label>

      @for (message of messages; track message.id) {

        <StackLayout class="message-card">

          <Label
            [text]="getChurchName(message)"
            class="church-name"
            textWrap="true">
          </Label>

          <Label
            [text]="message.author"
            class="author">
          </Label>

          <Label
            [text]="message.date"
            class="author">
          </Label>

          <Label
            [text]="message.title"
            class="message-title"
            textWrap="true">
          </Label>

          <Label
            [text]="message.verse"
            class="author"
            textWrap="true">
          </Label>

          <Label
            [text]="message.content"
            class="content"
            textWrap="true">
          </Label>

          <GridLayout columns="*, *">

            <Button
              col="0"
              [text]="(isLiked(message) ? '♥ Aimé' : '♡ J’aime') + ' (' + message.likes + ')'"
              [class]="isLiked(message) ? 'liked-button' : 'like-button'"
              (tap)="toggleLike(message)">
            </Button>

            <Button
              col="1"
              [text]="'Commentaires (' + message.comments.length + ')'"
              (tap)="toggleComments(message)"
              class="comment-button">
            </Button>

          </GridLayout>

          @if (message.showComments) {

            <StackLayout class="comments-section">

              <Label
                text="Commentaires"
                class="comments-title">
              </Label>

              @for (comment of message.comments; track $index) {

                <StackLayout class="comment-card">

                  <Label
                    [text]="comment.author"
                    class="comment-author">
                  </Label>

                  <Label
                    [text]="comment.content"
                    class="comment-content"
                    textWrap="true">
                  </Label>

                  <Label
                    [text]="comment.date"
                    class="comment-date">
                  </Label>

                </StackLayout>

              } @empty {

                <Label
                  text="Soyez le premier à commenter."
                  class="empty-comments"
                  textWrap="true">
                </Label>

              }

              <TextView
                hint="Écrivez votre commentaire..."
                [text]="message.newComment"
                (textChange)="onCommentChange($event, message)"
                class="comment-input">
              </TextView>

              <Button
                text="Publier"
                (tap)="addComment(message)"
                class="publish-button">
              </Button>

            </StackLayout>

          }

        </StackLayout>

      } @empty {

        <StackLayout class="message-card">

          <Label
            text="Aucune publication disponible"
            class="message-title"
            textWrap="true">
          </Label>

          <Label
            text="Découvrez et suivez des églises pour recevoir leurs messages bibliques."
            class="content"
            textWrap="true">
          </Label>

        </StackLayout>

      }

    </StackLayout>

  </ScrollView>

  <ns-navigation row="1"></ns-navigation>

</GridLayout>
