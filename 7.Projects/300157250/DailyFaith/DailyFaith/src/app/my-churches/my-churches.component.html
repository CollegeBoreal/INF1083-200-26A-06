<ActionBar title="Mes abonnements"></ActionBar>

<GridLayout rows="*, auto">

  <ScrollView row="0">

    <StackLayout class="container">

      <Label
        text="MES ABONNEMENTS"
        class="page-title">
      </Label>

      <Label
        text="Restez connecté à vos communautés chrétiennes."
        class="subtitle"
        textWrap="true">
      </Label>

      <StackLayout class="statistics-card">

        <Label
          text="&#xf51d;"
          class="stat-icon">
        </Label>

        <Label
          [text]="totalChurches"
          class="stat-number">
        </Label>

        <Label
          [text]="totalChurches === 1 ? 'Église suivie' : 'Églises suivies'"
          class="stat-label">
        </Label>

      </StackLayout>

      @if (loading) {

        <ActivityIndicator
          [busy]="loading"
          color="#183B32">
        </ActivityIndicator>

        <Label
          text="Chargement de vos abonnements..."
          class="subtitle"
          textWrap="true">
        </Label>

      }

      @if (errorMessage) {

        <Label
          [text]="errorMessage"
          color="#B91C1C"
          textWrap="true">
        </Label>

      }

      <Button
        text="Actualiser"
        class="profile-button"
        [isEnabled]="!loading && !saving"
        (tap)="loadChurches()">
      </Button>

      <Label
        text="Mes communautés"
        class="section-title">
      </Label>

      @for (church of churches; track church.id) {

        <StackLayout class="church-card">

          <GridLayout rows="140, 40">

            <GridLayout
              row="0"
              class="cover">

              @if (church.cover) {

                <Image
                  [src]="getCoverPath(church)"
                  stretch="aspectFill">
                </Image>

              } @else {

                <Label
                  text="&#xf51d;"
                  class="cover-icon"
                  horizontalAlignment="center"
                  verticalAlignment="center">
                </Label>

              }

            </GridLayout>

            <GridLayout
              row="0"
              rowSpan="2"
              class="logo"
              horizontalAlignment="center"
              verticalAlignment="bottom">

              @if (church.logo) {

                <Image
                  [src]="getLogoPath(church)"
                  stretch="aspectFill"
                  class="logo-image">
                </Image>

              } @else {

                <Label
                  text="&#xf51d;"
                  class="logo-icon"
                  horizontalAlignment="center"
                  verticalAlignment="center">
                </Label>

              }

            </GridLayout>

          </GridLayout>

          <StackLayout class="church-content">

            <Label
              [text]="church.name"
              class="church-name"
              textWrap="true">
            </Label>

            <Label
              [text]="'@' + church.username"
              class="username">
            </Label>

            <Label
              text="✓ Abonné"
              class="following-badge"
              horizontalAlignment="center">
            </Label>

            <Label
              [text]="church.online ? '● Communauté en ligne' : 'Communauté locale'"
              [color]="church.online ? '#15803D' : '#A88A50'"
              fontSize="12"
              textAlignment="center"
              marginBottom="12">
            </Label>

            <GridLayout
              columns="25, *"
              class="information-row">

              <Label
                col="0"
                text="&#xf007;"
                class="small-icon">
              </Label>

              <Label
                col="1"
                [text]="church.pastor"
                class="information"
                textWrap="true">
              </Label>

            </GridLayout>

            <GridLayout
              columns="25, *"
              class="information-row">

              <Label
                col="0"
                text="&#xf3c5;"
                class="small-icon">
              </Label>

              <Label
                col="1"
                [text]="church.city + ', ' + church.country"
                class="information"
                textWrap="true">
              </Label>

            </GridLayout>

            <Label
              [text]="church.description"
              class="description"
              textWrap="true">
            </Label>

            @if (!church.online) {

              <Label
                [text]="church.followers.length + ' abonné(s)'"
                class="followers">
              </Label>

            }

            <Button
              text="Voir le profil"
              class="profile-button"
              [isEnabled]="!saving"
              (tap)="viewChurch(church)">
            </Button>

            <Button
              [text]="saving ? 'Veuillez patienter...' : 'Se désabonner'"
              class="unfollow-button"
              [isEnabled]="!saving && !loading"
              (tap)="unfollowChurch(church)">
            </Button>

          </StackLayout>

        </StackLayout>

      } @empty {

        @if (!loading && !errorMessage) {

          <StackLayout class="empty-card">

            <Label
              text="&#xf51d;"
              class="empty-icon">
            </Label>

            <Label
              text="Aucun abonnement"
              class="empty-title">
            </Label>

            <Label
              text="Recherchez votre église et abonnez-vous pour rester connecté à votre communauté."
              class="subtitle"
              textWrap="true">
            </Label>

          </StackLayout>

        }

      }

      <Button
        text="+ Découvrir des églises"
        class="discover-button"
        [isEnabled]="!saving"
        (tap)="discoverChurches()">
      </Button>

    </StackLayout>

  </ScrollView>

  <ns-navigation row="1"></ns-navigation>

</GridLayout>
