         selectedTabTextColor="#2563EB"

         tabBackgroundColor="#FFFFFF">

    <GridLayout *tabItem="{ title: 'Accueil' }">

    </GridLayout>

    <GridLayout *tabItem="{ title: 'Exercices' }">

    <GridLayout *tabItem="{ title: 'Progression' }">
        <page-router-outlet name="searchTab"></page-router-outlet>
    </GridLayout>

</TabView>
