<ActionBar title="FitTrack"></ActionBar>

<ScrollView backgroundColor="#F1F5F9">
    <StackLayout padding="20">

        <Label text="💪 FitTrack"
               fontSize="32"
               fontWeight="bold"
               color="#0F172A">
        </Label>

        <Label text="Ton compagnon sportif"
               fontSize="16"
               color="#64748B"
               marginBottom="25">
        </Label>

        <StackLayout backgroundColor="#152C43"
                     borderRadius="20"
                     padding="25">

            <Label text="OBJECTIF DE LA SEMAINE"
                   color="#CBD5E1"
                   fontSize="14">
            </Label>

            <Label text="3 séances"
                   fontSize="32"
                   fontWeight="bold"
                   color="white"
                   marginTop="10">
            </Label>

            <Label text="Reste actif et progresse !"
                   color="white"
                   marginTop="10">
            </Label>

        </StackLayout>

        <Label text="Mon tableau de bord"
               fontSize="22"
               fontWeight="bold"
               color="#0F172A"
               marginTop="25"
               marginBottom="15">
        </Label>

        <GridLayout columns="*, *">

            <StackLayout col="0"
                         backgroundColor="white"
                         borderRadius="15"
                         padding="15"
                         marginRight="5">

                <Label text="🏋️" fontSize="30"></Label>
                <Label text="Exercices" fontWeight="bold"
                       fontSize="18"></Label>
                <Label text="Programme sportif"
                       color="#64748B" textWrap="true"></Label>

            </StackLayout>

            <StackLayout col="1"
                         backgroundColor="white"
                         borderRadius="15"
                         padding="15"
                         marginLeft="5">

                <Label text="📈" fontSize="30"></Label>
                <Label text="Progression" fontWeight="bold"
                       fontSize="18"></Label>
                <Label text="Suivi des séances"
                       color="#64748B" textWrap="true"></Label>

            </StackLayout>

        </GridLayout>

    </StackLayout>
</ScrollView>
