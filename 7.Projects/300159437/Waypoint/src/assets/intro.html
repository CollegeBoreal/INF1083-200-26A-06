<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .cadre { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; background: #141414; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .son {
    position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 18px;
    background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center;
  }
  .son svg { width: 18px; height: 18px; fill: #fff; }
</style>
</head>
<body>
  <div class="cadre">
  <video id="v" src="intro.mp4" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
  </div>
  <div class="son" id="son" aria-label="Son">
    <svg viewBox="0 0 24 24" id="ico"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2"/></svg>
  </div>
<script>
  var v = document.getElementById('v');
  var ico = document.getElementById('ico');
  var on = '<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none"/>';
  var off = ico.innerHTML;
  function lancer() { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
  lancer();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) lancer(); });
  // Touche la vidéo : active ou coupe le son
  document.body.addEventListener('click', function () {
    v.muted = !v.muted;
    ico.innerHTML = v.muted ? off : on;
    lancer();
  });
</script>
</body>
</html>
