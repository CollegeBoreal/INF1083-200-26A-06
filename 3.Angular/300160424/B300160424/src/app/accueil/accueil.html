<h1>{{ titre }}</h1>

<button (click)="saluer()">Cliquez-moi</button>

@if (connecte) {
  <p>Connecté</p>
}

<h2>Liste des utilisateurs</h2>

<ul>
  @for (nom of noms; track nom) {
    <li>{{ nom }}</li>
  }
</ul>
<h2>Utilisateurs de l'API REST</h2>

<ul>
  @for (utilisateur of utilisateurs; track utilisateur.id) {
    <li>
      {{ utilisateur.name }} - {{ utilisateur.email }}
    </li>
  }
</ul>
