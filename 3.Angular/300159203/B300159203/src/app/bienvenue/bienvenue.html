<div class="card p-4">
  <!-- Titre exact demandé -->
  <h3 class="mb-4">Liste étudiant boréal section 6 technique système informatique</h3>

  <!-- Formulaire d'ajout d'étudiant -->
  <div class="mb-3 d-flex gap-2">
    <input type="text" class="form-control" placeholder="Nom de l'étudiant" [(ngModel)]="nouvelEtudiant">
    <button class="btn btn-primary" (click)="ajouterEtudiant()">Ajouter</button>
  </div>

  <!-- Liste des étudiants -->
  <ul class="list-group mb-4">
    <li *ngFor="let etudiant of etudiants; let i = index" class="list-group-item d-flex justify-content-between align-items-center">
      {{ etudiant }}
      <button class="btn btn-danger btn-sm" (click)="supprimerEtudiant(i)">✕ Supprimer</button>
    </li>
  </ul>

  <!-- Section Liste des Professeurs avec Mr. -->
  <h3>Liste des Professeurs</h3>
  <ul class="list-group">
    <li *ngFor="let prof of professeurs" class="list-group-item d-flex justify-content-between align-items-center">
      <strong>{{ prof.nom }}</strong>
      <span class="text-muted">({{ prof.email }})</span>
    </li>
  </ul>
</div>
