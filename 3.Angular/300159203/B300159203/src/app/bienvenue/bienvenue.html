<div style="padding: 20px; font-family: Arial, sans-serif;">
  <h1>{{ messageBienvenue }}</h1>
  <hr>

  <section>
    <h2>Événement Bouton</h2>
    <button (click)="saluer()">Cliquez-moi</button>
  </section>
  <hr>

  <section>
    <h2>Gestion des Étudiants</h2>
    <div style="margin-bottom: 10px;">
      <input 
        type="text" 
        [(ngModel)]="nouvelEtudiant" 
        placeholder="Nom de l'étudiant"
      >
      <button (click)="ajouterEtudiant()">Ajouter</button>
    </div>

    <ul>
      <li *ngFor="let etudiant of etudiants; let i = index">
        {{ etudiant }} 
        <button (click)="supprimerEtudiant(i)">❌ Supprimer</button>
      </li>
    </ul>
  </section>
  <hr>

  <section>
    <h2>Utilisateurs chargés via API REST</h2>
    <ul>
      <li *ngFor="let user of utilisateursAPI">
        <strong>{{ user.name }}</strong> ({{ user.email }})
      </li>
    </ul>
  </section>
</div>
