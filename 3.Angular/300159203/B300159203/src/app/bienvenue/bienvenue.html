<div class="main-container">
  <!-- En-tête principal -->
  <div class="header-banner">
    <h2>Liste étudiant boréal section 6 technique système informatique</h2>
  </div>

  <!-- Section Étudiants -->
  <div class="section-card">
    <h3>Gestion des Étudiants</h3>
    
    <div class="input-box">
      <input 
        type="text" 
        placeholder="Nom de l'étudiant..." 
        [(ngModel)]="nouvelEtudiant"
        (keyup.enter)="ajouterEtudiant()">
      <button class="btn-add" (click)="ajouterEtudiant()">+ Ajouter</button>
    </div>

    <ul class="student-list">
      <li *ngFor="let etudiant of etudiants; let i = index" class="student-item">
        <span>🎓 {{ etudiant }}</span>
        <button class="btn-delete" (click)="supprimerEtudiant(i)">Supprimer</button>
      </li>
    </ul>
  </div>

  <!-- Section Professeurs -->
  <div class="section-card">
    <h3>Liste des Professeurs</h3>
    <div class="prof-grid">
      <div *ngFor="let prof of professeurs" class="prof-card">
        <div class="prof-avatar">
          {{ prof.nom.replace('Mr. ', '').charAt(0) }}
        </div>
        <div>
          <div class="prof-name">{{ prof.nom }}</div>
          <div class="prof-email">{{ prof.email }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
