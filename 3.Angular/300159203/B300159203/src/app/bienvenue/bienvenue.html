<div class="container">
  <!-- Événement Bouton -->
  <div class="card">
    <h2>Événement Bouton</h2>
    <button class="btn-primary">Cliquez-moi</button>
  </div>

  <!-- Gestion des Étudiants -->
  <div class="card">
    <h2>Gestion des Étudiants</h2>
    <div class="input-group">
      <input 
        type="text" 
        [(ngModel)]="nouvelEtudiant" 
        placeholder="Nom de l'étudiant"
        (keyup.enter)="ajouterEtudiant()" 
      />
      <button class="btn-primary" (click)="ajouterEtudiant()">Ajouter</button>
    </div>

    <ul class="list">
      <li *ngFor="let etudiant of etudiants; let i = index" class="list-item">
        <span>{{ etudiant }}</span>
        <button class="btn-danger" (click)="supprimerEtudiant(i)">✕ Supprimer</button>
      </li>
    </ul>
  </div>

  <!-- Liste des Professeurs -->
  <div class="card">
    <h2>Liste des Professeurs</h2>
    <ul class="list">
      <li *ngFor="let prof of professeurs" class="list-item">
        <strong>{{ prof.nom }}</strong>
        <span class="email">({{ prof.email }})</span>
      </li>
    </ul>
  </div>
</div>
