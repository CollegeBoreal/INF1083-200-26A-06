<div class="container">

  <p>Nom : {{ nom }}</p>

  <h1>Bienvenue dans votre application {{ nom }} !</h1>

  <div class="menu">
    <button (click)="changerSection('Accueil')">🏠 Accueil</button>
    <button (click)="changerSection('Étudiants')">👨‍🎓 Étudiants</button>
    <button (click)="changerSection('Professeurs')">👨‍🏫 Professeurs</button>
    <button (click)="changerSection('Cours')">📚 Cours</button>
    <button (click)="changerSection('Utilisateurs')">👥 Utilisateurs</button>
  </div>

  <hr>

  <h2>{{ section }}</h2>

  <div *ngIf="section === 'Étudiants'" class="carte">
    👨‍🎓 Étudiants : {{ etudiants }}
  </div>

  <div *ngIf="section === 'Professeurs'" class="carte">
    👨‍🏫 Professeurs : {{ professeurs }}
  </div>

  <div *ngIf="section === 'Cours'" class="carte">
    📚 Cours : {{ cours }}
  </div>

  <div *ngIf="section === 'Utilisateurs'" class="carte">
    👥 Utilisateurs : {{ utilisateurs }}
  </div>

  <div *ngIf="section === 'Accueil'" class="carte">
    Bienvenue dans le portail universitaire INF1083.
  </div>

  <button class="btn-message"
          (click)="afficherMessage()">
      Afficher le message
  </button>

</div>
