<div class="entete">
  <div class="drapeau-amazigh">
    <div class="bande bleu"></div>
    <div class="bande vert"></div>
    <div class="bande jaune"></div>
    <div class="symbole">ⵣ</div>
  </div>

  <h1>{{ titre }}</h1>
</div>

<h2>Ajouter un étudiant</h2>

<input
  type="text"
  [(ngModel)]="nouvelEtudiant"
  placeholder="Nom de l'étudiant"
>

<button (click)="ajouterEtudiant()">Ajouter</button>

<h2>Liste des étudiants</h2>

<ul>
  <li *ngFor="let etudiant of etudiants; let i = index">
    {{ etudiant }}
    <button (click)="supprimerEtudiant(i)">Supprimer</button>
  </li>
</ul>
<app-reactive-forms></app-reactive-forms>
