<div style="display:flex; align-items:center; gap:20px;">

  <div style="
    position:relative;
    width:150px;
    height:90px;
    border:1px solid black;
  ">

    <div style="height:30px; background:#00a0dc;"></div>

    <div style="height:30px; background:#39a935;"></div>

    <div style="height:30px; background:#ffd700;"></div>

    <div style="
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      color:red;
      font-size:55px;
      font-weight:bold;
    ">
      ⵣ
    </div>

  </div>

  <h1>{{ titre }}</h1>
</div>

<h2>Ajouter un étudiant</h2>

<input
  type="text"
  [(ngModel)]="nouvelEtudiant"
  placeholder="Nom de l'étudiant"
>

<button (click)="ajouterEtudiant()">Ajouter</button>

<h2>Liste des étudiants</h2>

<ul>
  <li *ngFor="let etudiant of etudiants; let i = index">
    {{ etudiant }}
    <button (click)="supprimerEtudiant(i)">Supprimer</button>
  </li>
</ul>
