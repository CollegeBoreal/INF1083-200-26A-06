
<ActionBar title="Personnalités algériennes"></ActionBar>

<StackLayout>
  <ListView [items]="personService.items()">
    <ng-template let-person="item">
      <Label
        [text]="person.name"
        class="p-15"
        [nsRouterLink]="['/item', person.id]">
      </Label>
    </ng-template>
  </ListView>
</StackLayout>
