<ActionBar title="Détails du Joueur"></ActionBar>

<ScrollView>
  <StackLayout class="p-20" *ngIf="person()">
    <Label [text]="person()?.name" class="font-weight-bold font-size-28 mb-15" style="color: #111111;"></Label>

    <StackLayout class="hr mb-15"></StackLayout>

    <Label [text]="'⚽ Poste : ' + (person()?.role || '')" class="font-size-18 mb-10" style="color: #444444;"></Label>
    <Label [text]="'🎯 Buts en carrière : ' + (person()?.goals || '')" class="font-size-18 mb-15 font-weight-bold" style="color: #2e7d32;"></Label>

    <Label text="🏆 Trophées & Palmarès :" class="font-weight-bold font-size-18 mt-10 mb-5"></Label>
    <Label [text]="person()?.notableAchievements" class="font-size-15 mb-15" textWrap="true" style="color: #555555;"></Label>

    <Label text="📖 Biographie :" class="font-weight-bold font-size-18 mt-10 mb-5"></Label>
    <Label [text]="person()?.bio" class="font-size-15" textWrap="true" style="color: #555555;"></Label>
  </StackLayout>
</ScrollView>
