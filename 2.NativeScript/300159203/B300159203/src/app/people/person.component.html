<ActionBar title="Best Football Players Ever"></ActionBar>

<StackLayout>
  <ListView [items]="items" (itemTap)="onPersonTap($event)">
    <ng-template let-item="item">
      <StackLayout class="item" padding="15">
        <Label [text]="item.name" class="h2" fontWeight="bold"></Label>
        <Label [text]="item.role" class="body" color="#666666"></Label>
      </StackLayout>
    </ng-template>
  </ListView>
</StackLayout>
