<ActionBar title="Best Football Players Ever"></ActionBar>

<GridLayout>
  <ListView [items]="items" (itemTap)="onItemTap($event)" class="list-group">
    <ng-template let-item="item">
      <StackLayout class="list-group-item p-15">
        <Label [text]="item.name" class="font-weight-bold font-size-18" style="color: #333333;"></Label>
        <Label [text]="item.role" class="font-size-14" style="color: #666666;"></Label>
      </StackLayout>
    </ng-template>
  </ListView>
</GridLayout>
